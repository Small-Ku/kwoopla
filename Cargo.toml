[package]
name = "kwoopla"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "HomePlug AV/AV2 discovery and diagnostics"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
etherparse = "0.21"
zerocopy = { version = "0.8", features = ["derive"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
